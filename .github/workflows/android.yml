name: "Build AmanGuard Family (Web & Android APKs)"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish APKs as GitHub Release'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  build-web:
    name: Build AmanGuard Web Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: 4. Build Web Application
        run: |
          npm run build

      - name: 5. Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amanguard-web-build
          path: dist/
          retention-days: 14

  build-android:
    name: Build AmanGuard Android APKs (Child & Parent)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Verify Android SDK & Accept Licenses
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: 4. Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: 5. Configure Firebase Services & API Keys
        run: |
          echo "Verifying and configuring google-services.json for Child and Parent apps..."
          if [ -n "${{ secrets.GOOGLE_SERVICES_CHILD_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_CHILD_B64 }}" | base64 -d > child/google-services.json
            echo "✅ Loaded child/google-services.json from secret"
          fi

          if [ -n "${{ secrets.GOOGLE_SERVICES_PARENT_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_PARENT_B64 }}" | base64 -d > parent/google-services.json
            echo "✅ Loaded parent/google-services.json from secret"
          fi

          ls -l child/google-services.json parent/google-services.json
        env:
          GOOGLE_SERVICES_CHILD_B64: ${{ secrets.GOOGLE_SERVICES_CHILD_B64 }}
          GOOGLE_SERVICES_PARENT_B64: ${{ secrets.GOOGLE_SERVICES_PARENT_B64 }}

      - name: 6. Build Child & Parent Debug APKs
        run: |
          echo "Building Child & Parent APKs..."
          gradle :child:assembleDebug :parent:assembleDebug --stacktrace --no-daemon
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: 7. Prepare APK Deliverables
        run: |
          mkdir -p apk_output
          
          # Find and copy Child APK
          CHILD_APK=$(find child/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$CHILD_APK" ] && [ -f "$CHILD_APK" ]; then
            cp "$CHILD_APK" apk_output/AmanGuard-Child.apk
            echo "✅ Child APK ready: apk_output/AmanGuard-Child.apk"
          else
            echo "⚠️ Child APK not found in default path"
          fi

          # Find and copy Parent APK
          PARENT_APK=$(find parent/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$PARENT_APK" ] && [ -f "$PARENT_APK" ]; then
            cp "$PARENT_APK" apk_output/AmanGuard-Parent.apk
            echo "✅ Parent APK ready: apk_output/AmanGuard-Parent.apk"
          else
            echo "⚠️ Parent APK not found in default path"
          fi

          ls -lh apk_output/

      - name: 8. Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmanGuard-Android-APKs
          path: apk_output/
          retention-days: 30
          if-no-files-found: warn

      - name: 9. Publish GitHub Release with APKs
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name || 'v1.2.0' }}
          name: AmanGuard Family Release ${{ github.event.inputs.release_tag || github.ref_name || 'v1.2.0' }}
          files: apk_output/*.apk
          draft: false
          prerelease: false
          body: |
            ### 🛡️ منظومة أمان جارد للرقابة الأبوية - AmanGuard Family
            
            #### 📦 حزم التطبيقات المتاحة للتحميل المباشر:
            - **تطبيق الطفل:** `AmanGuard-Child.apk` (`com.amanguard.child`)
              - تتبع الموقع الجغرافي الدقيق في الخلفية (GPS).
              - حظر التطبيقات عبر إمكانية الوصول (`AccessibilityService`).
              - قيود وقت الشاشة وجدول النوم.
              - إقران فوري برمز QR أو رمز من 8 خانات.
            - **تطبيق ولي الأمر:** `AmanGuard-Parent.apk` (`com.amanguard.parent`)
              - متابعة مباشرة على الخريطة والمناطق الآمنة.
              - إرسال الأوامر والتحكم الفوري.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
